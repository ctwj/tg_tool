[package]
name = "tgTool"
version = "0.1.0"
edition = "2024"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["multipart"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
tower-sessions = "0.14"
tower-sessions-memory-store = "0.14"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "postgres", "migrate", "chrono", "uuid"] }

# Telegram client
grammers-client = { version = "0.7", features = ["proxy"] }
grammers-session = "0.7"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client (webhook, push) — use rustls to avoid OpenSSL dependency
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "socks"] }

# Auth & crypto
bcrypt = "0.16"
uuid = { version = "1", features = ["v4"] }
jsonwebtoken = "9"

# Config
dotenvy = "0.15"
clap = { version = "4", features = ["derive", "env"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Static file embedding
rust-embed = "8"
mime_guess = "2"

# Captcha
captcha-rs = "0.5"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"

# Misc
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
regex = "1"
once_cell = "1"
dashmap = "6"
sha2 = "0.10"

[dev-dependencies]
axum-test = "17"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

# 覆盖率工具通过 cargo install cargo-llvm-cov 安装（不在 Cargo.toml 中声明）
# 运行: cargo llvm-cov --html
