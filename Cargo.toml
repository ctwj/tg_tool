[package]
name = "tgTool"
version = "0.1.0"
edition = "2024"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["multipart"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
tower-sessions = "0.14"
tower-sessions-memory-store = "0.14"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "postgres", "migrate", "chrono", "uuid"] }

# Telegram client
grammers-client = { version = "0.7", features = ["proxy"] }
grammers-session = "0.7"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client (webhook, push) — use rustls to avoid OpenSSL dependency
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks", "multipart"] }

# Auth & crypto
bcrypt = "0.16"
uuid = { version = "1", features = ["v4"] }
jsonwebtoken = "9"

# Config
dotenvy = "0.15"
clap = { version = "4", features = ["derive", "env"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Static file embedding
rust-embed = { version = "8", optional = true }
mime_guess = "2"

# HTML parsing (crawler feature 042)
scraper = "0.22"

# JSON Path 提取（crawler feature 043 — 字段配置器 <script> 内嵌 JSON 提取）
serde_json_path = "0.7"

# JS sandbox for crawler script extractor (feature 046 — rquickjs: QuickJS Rust binding)
# 不启用 `bindgen` feature：它会在构建时用 libclang 实时生成绑定（需安装 LLVM + LIBCLANG_PATH）。
# 默认走 rquickjs 预生成绑定（prebuilt bindings），功能等价，零外部依赖。
rquickjs = { version = "0.7", features = ["loader", "allocator"] }

# Captcha
captcha-rs = "0.5"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"

# Misc
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
regex = "1"
once_cell = "1"
dashmap = "6"
sha2 = "0.10"

[features]
default = []
embed-frontend = ["rust-embed"]

[dev-dependencies]
axum-test = "17"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
wiremock = "0.6"

# 覆盖率工具通过 cargo install cargo-llvm-cov 安装（不在 Cargo.toml 中声明）
# 运行: cargo llvm-cov --html
