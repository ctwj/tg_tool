name: Build and Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" Cargo.toml
          echo "Building version: ${VERSION}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Build frontend
        run: cd web && pnpm install && pnpm build

      - name: Build backend
        run: cargo build --release --features embed-frontend --target x86_64-unknown-linux-musl

      - name: Install UPX
        run: |
          wget -q https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-amd64_linux.tar.xz
          tar xf upx-4.2.4-amd64_linux.tar.xz
          sudo cp upx-4.2.4-amd64_linux/upx /usr/local/bin/

      - name: Compress binary with UPX
        run: upx --best target/x86_64-unknown-linux-musl/release/tgTool

      - name: Rename binary
        run: |
          mv target/x86_64-unknown-linux-musl/release/tgTool \
            target/x86_64-unknown-linux-musl/release/tgTool-x86_64-unknown-linux-musl

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tgTool-x86_64-unknown-linux-musl
          path: target/x86_64-unknown-linux-musl/release/tgTool-x86_64-unknown-linux-musl

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: tgTool-x86_64-unknown-linux-musl

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: tgTool-x86_64-unknown-linux-musl
          generate_release_notes: true
